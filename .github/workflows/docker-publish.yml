name: Docker Publish

on:
  push:
    tags:
      - 'v*.*.*' # Trigger on version tag pushes (e.g., v0.7.1)
  pull_request:
    branches:
      - main     # Trigger on PRs targeting main branch
  workflow_dispatch: {} # Allow manual triggering from the Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Needed for checkout
      packages: write # Needed to push packages to ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Create 'main' tag on push to main branch
            type=ref,event=branch,branch=main
            # Create 'X.Y.Z', 'X.Y', 'X' tags on tag push (e.g., v1.2.3 -> 1.2.3, 1.2, 1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Only create 'latest' tag if it's a tag push AND it's a non-prerelease version tag (no '-')
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            # Create a tag for PRs (e.g., pr-123) - useful for testing PR builds
            type=ref,event=pr
            # For manual workflow runs, use branch name with 'manual' suffix (only when ref is a branch)
            type=raw,value={{branch}}-manual,enable=${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        # Only login for pushes and manual runs, not for PRs
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release builds must carry a real package version. `.dockerignore` excludes
      # .git, so uv-dynamic-versioning falls back to 0.0.0 unless VERSION is
      # injected. A tag cut from a branch without that injection publishes 0.0.0
      # silently, which makes every past advisory match in vulnerability scanners.
      # Build the amd64 layer once (cached, reused by the push below) and assert
      # the installed version before anything is published.
      - name: Build amd64 image for version verification
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: mcp-atlassian:verify
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha

      - name: Verify injected package version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected='${{ steps.meta.outputs.version }}'
          actual=$(docker run --rm --entrypoint sh mcp-atlassian:verify -c \
            'ls /app/.venv/lib/python*/site-packages | sed -n "s/^mcp_atlassian-\(.*\)\.dist-info$/\1/p" | head -1')
          echo "expected=${expected} actual=${actual}"
          if [ -z "${actual}" ]; then
            echo "::error::Could not determine the installed mcp-atlassian version from the image."
            exit 1
          fi
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::Image reports version '${actual}' but the tag expects '${expected}'."
            echo "::error::The VERSION build arg did not reach the build. Refusing to publish."
            exit 1
          fi

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Only push for non-PR events
          push: ${{ github.event_name != 'pull_request' }}
          # Use tags and labels from metadata action
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          # Enable Docker layer caching
          cache-from: type=gha
          cache-to: type=gha,mode=max
