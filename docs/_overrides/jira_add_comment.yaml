example: |
  {"issue_key": "PROJ-123", "body": "## Investigation\n\nFound the root cause in module X."}
tips: |
  Supports Markdown formatting. On Jira Cloud, mention users with `[~accountid:ACCOUNT_ID]` or `@[Display Name](accountid:ACCOUNT_ID)`. Use `visibility` to restrict a comment to a Jira group or project role. The generated schema lists `body`, but callers may use `comment` as an equivalent input alias for the same comment text.

  For an ordinary comment, omit `public`. On a Jira Service Management customer request, setting `public` sends the comment through the ServiceDesk API: `public: false` posts an internal (agent-only) note and `public: true` a customer-visible reply. There is no fallback to the regular comment API if that call fails. On an issue that is not a JSM customer request, `public` is ignored and an ordinary comment is posted (any `visibility` restriction applies to it). `public` cannot be combined with `visibility` on a request. In a project listed in `JIRA_INTERNAL_ONLY_PROJECTS`, only `public: false` is accepted on a request.
